[package]
name = "psx-libretro"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
description = "libretro core for RustStation, a clean-room PlayStation emulator."

[lib]
# cdylib -> libpsxcore_libretro.so / psxcore_libretro.dll / libpsxcore_libretro.dylib.
name = "psxcore_libretro"
crate-type = ["cdylib"]

[dependencies]
psx-core = { path = "../psx-core" }
