[package]
name = "psx-runner"
version = "0.4.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
description = "Dev harnesses for RustStation: test-ROM runs with TTY capture, headless renders, a minimal libretro frontend, and save-state fingerprinting."

# Dev harnesses. `testrom` runs the CPU/GTE/GPU conformance suites (kept out of
# tree under tests/) and reads each one's own printed verdict.

# Boot a BIOS and step it, printing the BIOS TTY and a CPU trace on demand.
[[bin]]
name = "psx"
path = "src/psx.rs"

# PSX-EXE runner: sideload at the shell hook, capture TTY, pass/fail on the
# suite's own printed verdict.
[[bin]]
name = "testrom"
path = "src/testrom.rs"

# Cross-platform save-state fingerprint (netplay byte-parity proof).
[[bin]]
name = "fingerprint"
path = "src/fingerprint.rs"

# Dump VRAM or the display area to a PNG, for eyeballing against the reference
# images the hardware test suite ships.
[[bin]]
name = "shot"
path = "src/shot.rs"

# A minimal libretro frontend that dlopens the built core and drives the C ABI.
# Everything else here links psx-core directly, which leaves the layer that
# actually ships as the one nothing exercises.
[[bin]]
name = "retrohost"
path = "src/retrohost.rs"

[dependencies]
psx-core = { path = "../psx-core" }
psx-chd = { path = "../psx-chd" }
# Dev-harness only. The core and the shipped libretro cdylib pull in nothing.
png = "0.17"

# Compare two disc images, of any format, track by track and sector by sector.
[[bin]]
name = "discdiff"
path = "src/discdiff.rs"
