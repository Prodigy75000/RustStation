[package]
name = "psx-runner"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Dev harnesses for RustStation: BIOS boot, PSX-EXE test-ROM runs with TTY capture, and save-state fingerprinting."

# Dev harnesses. `testrom` comes first: it is how the R3000A gets ground to
# green against the CPU/GTE conformance suites in dumps/, the same role
# `tomharte` plays for the SNES 65C816 and the GBA ARM7. The `shot` png bin
# mirrors the other cores and lands once the GPU rasterizes.

# Boot a BIOS and step it, printing the BIOS TTY and a CPU trace on demand.
[[bin]]
name = "psx"
path = "src/psx.rs"

# PSX-EXE runner: sideload at the shell hook, capture TTY, pass/fail on the
# suite's own printed verdict.
[[bin]]
name = "testrom"
path = "src/testrom.rs"

# Cross-platform save-state fingerprint (netplay byte-parity proof).
[[bin]]
name = "fingerprint"
path = "src/fingerprint.rs"

[dependencies]
psx-core = { path = "../psx-core" }
