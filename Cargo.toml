# RustStation: a clean-room Sony PlayStation (PS1) emulator core, written from
# scratch in Rust.
[workspace]
resolver = "2"
members = ["crates/psx-core", "crates/psx-libretro", "crates/psx-runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Prodigy75000/RustStation"
authors = ["Prodigy75000"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
