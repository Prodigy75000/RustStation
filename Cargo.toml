# RustStation: a clean-room Sony PlayStation (PS1) emulator core, written from
# scratch in Rust.
# Standalone workspace (this repo builds on its own; no sibling cores needed).
[workspace]
resolver = "2"
members = ["crates/psx-core", "crates/psx-libretro", "crates/psx-runner"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
